[package]
name = "f3d-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read Fusion F3D/F3Z geometry assets, ASM B-Rep records and assemblies without Fusion"
repository = "https://github.com/neofactory/f3d-rs"
license = "MIT"
exclude = ["validation-output/**", "target/**"]

[lib]
name = "f3d"

[dependencies]
earcutr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ruzstd = "0.9.1"
crc32fast = "1.5"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Native test fixtures use the reference encoder. Library builds and browser
# builds use only pure-Rust decompression.
zip = { version = "9.4.2", default-features = false, features = ["zstd"] }
zstd = "0.14.3"

[lints.rust]
unsafe_code = "forbid"

