[package]
name = "f3d-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read Fusion F3D/F3Z geometry assets, ASM B-Rep records and assemblies without Fusion"
repository = "https://github.com/neofactory/f3d-rs"
license = "MIT"
exclude = ["validation-output/**", "target/**"]

[lib]
name = "f3d"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs", "zstd"] }

[dev-dependencies]
zstd = "0.14.3"

[lints.rust]
unsafe_code = "forbid"

